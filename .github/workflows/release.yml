name: release

# When a release like v1.2.3 is published, move the major tag (v1) to it, so `@v1` users get it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the major tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a vX.Y.Z release; leaving the major tag alone."
            exit 0
          fi
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
